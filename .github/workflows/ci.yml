name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Blocking. The hedge that used to be here - install, and warn instead
      # of failing - was copied from a project that pins heavy ML wheels.
      # This one needs fastapi, uvicorn, pydantic, numpy and requests, and if
      # those will not install then nothing below this line means anything.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Byte-compile all sources
        run: python -m compileall -q .

      - name: Lint
        run: |
          pip install ruff
          ruff check --output-format=github . || echo "::warning::ruff reported issues"

      # This step used to be guarded by
      #   if ls test_*.py tests/ **/test_*.py >/dev/null 2>&1
      # and `ls` exits non-zero when ANY of its arguments is missing. There is
      # no test_*.py at the repo root, so the guard was always false, the step
      # always printed "no tests found", and the badge stayed green over a
      # suite that had a failing test in it. There are tests. Run them.
      - name: Tests
        run: pytest -q
